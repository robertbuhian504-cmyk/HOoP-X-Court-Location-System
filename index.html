<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOoP X - Court Location System</title>
    <link rel="stylesheet" href="style.css">
    <script src="Script.js" defer></script>
</head>
<body>
    <header>
        <h1>HOoP X - COURT LOCATION SYSTEM</h1>
        <p>find basketball courts near you</p>
    </header>

    <div class="toolbar-wrap">
        <nav class="toolbar" aria-label="Court filters">
            <button id="chip-all" class="chip active" type="button" data-filter="all">ALL COURTS</button>
            <button id="chip-indoor" class="chip" type="button" data-filter="indoor">INDOOR</button>
            <button id="chip-outdoor" class="chip" type="button" data-filter="outdoor">OUTDOOR</button>
        </nav>
    </div>

    <main class="content-shell">
        <section class="search-panel">
            <div class="search-row">
                <input id="search" type="search" placeholder="Search by court or location" aria-label="Search courts">
                <button id="near-me" type="button">NEAR ME</button>
            </div>
            <p id="geo-status" class="geo-status" aria-live="polite"></p>
        </section>

        <section id="grid" class="court-grid" aria-live="polite"></section>
    </main>

    <div id="backdrop" class="backdrop" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-name">
            <button id="close-modal" class="close-modal" type="button" aria-label="Close">×</button>
            <img id="m-img" src="" alt="Selected court">
            <div class="modal-content">
                <h2 id="m-name"></h2>
                <p id="m-addr"></p>
                <a id="m-map" href="#" target="_blank" rel="noopener">GET DIRECTIONS</a>
                <table class="hours-table" aria-label="Court hours">
                    <tbody id="m-hours"></tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
